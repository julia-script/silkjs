  { library = "m", mode = "dynamic", os = "linux" },
]

# SIMDe, the headers WAMR's SIMD interpreter builds on; GitHub's archive of the pinned commit.
[native.archive.silkjs-simde]
url = "https://codeload.github.com/simd-everywhere/simde/tar.gz/71fd833d9666141edcd1d3c109a80e228303d8d7"
sha256 = "72b2c14a487560b7eb203795f2c2fead5c7499662e639944cca2a9bb19f09029"
strip = 1

[[generate]]
run = ["tools/embed.py"]
outputs = ["builtin_sources.c", "src/runtime/embedded.silk"]
