[package]
name = "silkjsruntime"
version = "0.1.0"
# The embedding API (src/runtime/embed.silk), the loop it turns, and the hook for an embedder's own
# native functions (src/libs/core/embedder.silk). src/main.silk is the
# executable, the first embedder; src/embed_smoke.silk is the embedding API's smoke test.
exports = ["runtime.embed", "runtime.session", "libs.core.embedder", "libs.core.host", "embed_smoke"]
silk-version = "0.1.0-dev.72+9c780a04d6ef"

[dependencies]
# The engine, from this repository's modules/engine.
silkjs = { path = "../engine" }
# The package manager, from this repository's modules/pm: `silkjsruntime install` and the other commands.
pm = { path = "../pm" }
# SQLite 3 compiled from the amalgamation that silk-lang/lib-sqlite pins, with the features Node builds.
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "8b25951a96112d5151c54f26d7cc8b78d0bcfd12", package = "db-sqlite" }

[native]
link = [
  { static-archive = "build/native/libsilk_wamr.a" },
  { static-archive = "build/native/libuvwasi.a" },
  { static-archive = "build/native/libsilk_http_parser.a" },
  { static-archive = "build/native/libsilk_util.a" },
  { static-archive = "build/native/libsilk_builtin_cache.a" },
  { static-archive = "build/native/libuv.a" },
  { static-archive = "build/native/libssl.a" },
  { static-archive = "build/native/libcrypto.a" },
  { static-archive = "build/native/libbrotlienc.a" },
  { static-archive = "build/native/libbrotlidec.a" },
  { static-archive = "build/native/libbrotlicommon.a" },
  { static-archive = "build/native/libzstd.a" },
  { static-archive = "build/native/libnghttp2.a" },
  { library = "z", mode = "dynamic" },
  { library = "pthread", mode = "dynamic" },
  { library = "m", mode = "dynamic" },
]
