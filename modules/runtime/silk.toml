[package]
name = "silkjsruntime"
version = "0.1.0"
# The embedding API (src/runtime/embed.silk), the loop it turns, and the hook for an embedder's own
# native functions (src/libs/core/embedder.silk). src/main.silk is the
# executable, the first embedder; src/embed_smoke.silk is the embedding API's smoke test.
exports = ["runtime.embed", "runtime.session", "libs.core.embedder", "libs.core.host", "embed_smoke"]
silk-version = "0.1.0-dev.74+205aea3f5b2e"

[dependencies]
# The engine, from this repository's modules/engine.
silkjs = { path = "../engine" }
# The package manager, from this repository's modules/pm: `silkjsruntime install` and the other commands.
pm = { path = "../pm" }
# SQLite 3 compiled from the amalgamation that silk-lang/lib-sqlite pins, with the features Node builds.
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "5219f8c2aa5f9bf9c0880c7cc2e0c5b1d343052b", package = "db-sqlite" }
# The C libraries Node builds with, each compiled by Silk from its pinned release (../native).
libuv = { path = "../native/libuv", package = "silkjs-libuv" }
openssl = { path = "../native/openssl", package = "silkjs-openssl" }
nghttp2 = { path = "../native/nghttp2", package = "silkjs-nghttp2" }
zlib = { path = "../native/zlib", package = "silkjs-zlib" }
zstd = { path = "../native/zstd", package = "silkjs-zstd" }
brotli = { path = "../native/brotli", package = "silkjs-brotli" }

# The runtime's own C, and WAMR: vendor/wamr is WAMR with vendor/wamr/patches applied
# (tools/vendor_wamr.py writes it). builtin_sources.c embeds the built-in JavaScript (tools/embed.py).
# tools/build.py links the executable with the built-ins' bytecode and a build identity besides.
[native]
sources = [
  { c = "builtin_sources.c", flags = ["-std=c23", "-O2", "-w"] },
  { c = "src/ext/builtin_cache.c", flags = ["-std=gnu23", "-O2", "-w"] },
