    "vendor/wamr/core/shared/platform/common/memory/mremap.c",
    "vendor/wamr/invoke_native.c",
    "src/ext/wamr/*.c",
  ], include = ["vendor/wamr/core/iwasm/interpreter", "vendor/wamr/core/iwasm/common/gc", "silkjs-simde:", "vendor/wamr/core/iwasm/include", "vendor/wamr/core/shared/platform/darwin", "vendor/wamr/core/shared/platform/include", "vendor/wamr/core/shared/mem-alloc", "vendor/wamr/core/iwasm/common", "vendor/wamr/core/shared/utils", "src/ext/wamr"], flags = ["-std=gnu11", "-O2", "-w", "-DNDEBUG", "-DBH_ENABLE_GC_CORRUPTION_CHECK=0", "-DBH_FREE=wasm_runtime_free", "-DBH_MALLOC=wasm_runtime_malloc", "-DWASM_DISABLE_HW_BOUND_CHECK=1", "-DWASM_DISABLE_STACK_HW_BOUND_CHECK=1", "-DWASM_DISABLE_WAKEUP_BLOCKING_OP=0", "-DWASM_DISABLE_WRITE_GS_BASE=0", "-DWASM_ENABLE_AOT_INTRINSICS=0", "-DWASM_ENABLE_BULK_MEMORY=1", "-DWASM_ENABLE_CUSTOM_NAME_SECTION=1", "-DWASM_ENABLE_EXCE_HANDLING=1", "-DWASM_ENABLE_EXTENDED_CONST_EXPR=1", "-DWASM_ENABLE_FAST_INTERP=0", "-DWASM_ENABLE_GC=1", "-DWASM_ENABLE_INTERP=1", "-DWASM_ENABLE_LOAD_CUSTOM_SECTION=1", "-DWASM_ENABLE_MEMORY64=1", "-DWASM_ENABLE_MINI_LOADER=0", "-DWASM_ENABLE_MULTI_MEMORY=1", "-DWASM_ENABLE_MULTI_MODULE=1", "-DWASM_ENABLE_QUICK_AOT_ENTRY=0", "-DWASM_ENABLE_REF_TYPES=1", "-DWASM_ENABLE_SHARED_MEMORY=1", "-DWASM_ENABLE_SHRUNK_MEMORY=1", "-DWASM_ENABLE_SIMD=1", "-DWASM_ENABLE_SIMDE=1", "-DWASM_ENABLE_TAGS=1", "-DWASM_ENABLE_TAIL_CALL=1", "-DWASM_GLOBAL_HEAP_SIZE=10485760", "-DBH_PLATFORM_DARWIN"], os = "macos" },
