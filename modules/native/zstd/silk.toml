[package]
name = "silkjs-zstd"
description = "Zstandard, compiled from its pinned release for the SilkJS runtime"
version = "1.5.7"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

# The multithreaded library, as `make` builds it; the x86-64 assembly decoder is left out, since
# Silk compiles C only (the C decoder is the one other targets use).
[native]
sources = [
  { c = ["silkjs-zstd:lib/common/*.c", "silkjs-zstd:lib/compress/*.c", "silkjs-zstd:lib/decompress/*.c"], include = ["silkjs-zstd:lib", "silkjs-zstd:lib/common"], flags = ["-O2", "-w", "-DZSTD_MULTITHREAD", "-DZSTD_DISABLE_ASM", "-DXXH_NAMESPACE=ZSTD_"], os = ["linux", "macos"] },
]

[native.archive.silkjs-zstd]
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
strip = 1
