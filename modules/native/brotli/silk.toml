[package]
name = "silkjs-brotli"
description = "Brotli, compiled from its pinned release for the SilkJS runtime"
version = "1.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

[native]
sources = [
  { c = ["silkjs-brotli:c/common/*.c", "silkjs-brotli:c/enc/*.c", "silkjs-brotli:c/dec/*.c"], include = ["silkjs-brotli:c/include"], flags = ["-O2", "-w"], os = ["linux", "macos"] },
]
link = [{ library = "m", mode = "dynamic", os = "linux" }]

# GitHub's archive of the v1.1.0 commit.
[native.archive.silkjs-brotli]
url = "https://codeload.github.com/google/brotli/tar.gz/ed738e842d2fbdf2d6459e39267a633c4a9b2f5d"
sha256 = "aaa739962a45b508b2e783b915e6b2b57ed3b12bd4b0feac73acfb144dffa54f"
strip = 1
