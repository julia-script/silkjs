[package]
name = "silkjs-brotli"
description = "Brotli, compiled from its pinned release for the SilkJS runtime"
version = "1.2.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

[native]
sources = [
  { c = ["silkjs-brotli:c/common/*.c", "silkjs-brotli:c/enc/*.c", "silkjs-brotli:c/dec/bit_reader.c", "silkjs-brotli:c/dec/huffman.c",
      "silkjs-brotli:c/dec/prefix.c", "silkjs-brotli:c/dec/state.c", "silkjs-brotli:c/dec/static_init.c", "patched/dec/decode.c"],
    include = ["patched/include", "silkjs-brotli:c/include", "silkjs-brotli:c/dec"], flags = ["-O2", "-w"], os = ["linux", "macos"] },
]
link = [{ library = "m", mode = "dynamic", os = "linux" }]

# GitHub's archive of the v1.2.0 commit. Node 24 bundles v1.2.0 with upstream 0ed4268 ("Detect and
# report invalid stream earlier", 2026-02-27) applied: patched/ holds that commit's dec/decode.c and
# include/brotli/decode.h, which replace the archive's, so decoder errors match Node's
# (BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH).
[native.archive.silkjs-brotli]
url = "https://codeload.github.com/google/brotli/tar.gz/028fb5a23661f123017c060daa546b55cf4bde29"
sha256 = "0afe09a53c8bad9861c8dd1fc1284308d54f19d2979ba3541cfdcc9b05fe360f"
strip = 1
