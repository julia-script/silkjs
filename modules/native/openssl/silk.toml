[package]
name = "silkjs-openssl"
description = "OpenSSL's libcrypto and libssl, compiled from the pinned release for the SilkJS runtime"
version = "3.5.4"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

# OpenSSL builds with perl: tools/generate.py runs its Configure once and commits what that writes
# (generated/, and the lists below), so a build needs only the release archive and Clang.
