[package]
name = "silkjs-nghttp2"
description = "nghttp2, compiled from its pinned release for the SilkJS runtime"
version = "1.66.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

# The defines stand in for the config.h its configure step writes; the library needs no others.
[native]
sources = [
  { c = "silkjs-nghttp2:lib/*.c", include = ["silkjs-nghttp2:lib/includes", "silkjs-nghttp2:lib"], flags = ["-O2", "-w", "-DBUILDING_NGHTTP2", "-DNGHTTP2_STATICLIB", "-DHAVE_ARPA_INET_H=1", "-DHAVE_NETINET_IN_H=1", "-DHAVE_CLOCK_GETTIME=1", "-DHAVE_DECL_CLOCK_MONOTONIC=1"], os = ["linux", "macos"] },
]

[native.archive.silkjs-nghttp2]
url = "https://github.com/nghttp2/nghttp2/releases/download/v1.66.0/nghttp2-1.66.0.tar.gz"
sha256 = "e178687730c207f3a659730096df192b52d3752786c068b8e5ee7aeb8edae05a"
strip = 1
