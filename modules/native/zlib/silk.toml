[package]
name = "silkjs-zlib"
description = "zlib, compiled from its pinned release for the SilkJS runtime"
version = "1.3.1"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

[native]
sources = [
  { c = "silkjs-zlib:*.c", include = ["silkjs-zlib:"], flags = ["-O2", "-w", "-DZ_HAVE_UNISTD_H", "-D_LARGEFILE64_SOURCE=1"], os = ["linux", "macos"] },
]

[native.archive.silkjs-zlib]
url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
strip = 1
