[package]
name = "silkjs-libuv"
description = "libuv, compiled from its pinned release, and uvwasi on it, for the SilkJS runtime"
version = "1.51.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

# uvwasi/ is uvwasi e76edba (nodejs/uvwasi) with ownership.patch applied: its src/, include/ and
# LICENSE. It lives here because it builds against libuv's headers, which only this manifest names.
[native]
sources = [
  { c = "uvwasi/src/*.c", include = ["uvwasi/include", "silkjs-uv:include"], flags = ["-std=gnu99", "-O2", "-w", "-DNDEBUG", "-D_GNU_SOURCE", "-D_POSIX_C_SOURCE=200112"], os = "linux" },
  { c = "uvwasi/src/*.c", include = ["uvwasi/include", "silkjs-uv:include"], flags = ["-std=gnu99", "-O2", "-w", "-DNDEBUG"], os = "macos" },
  { c = [
    "silkjs-uv:src/fs-poll.c", "silkjs-uv:src/idna.c", "silkjs-uv:src/inet.c", "silkjs-uv:src/random.c", "silkjs-uv:src/strscpy.c",
    "silkjs-uv:src/strtok.c", "silkjs-uv:src/thread-common.c", "silkjs-uv:src/threadpool.c", "silkjs-uv:src/timer.c",
    "silkjs-uv:src/uv-common.c", "silkjs-uv:src/uv-data-getter-setters.c", "silkjs-uv:src/version.c",
    "silkjs-uv:src/unix/async.c", "silkjs-uv:src/unix/core.c", "silkjs-uv:src/unix/dl.c", "silkjs-uv:src/unix/fs.c",
    "silkjs-uv:src/unix/getaddrinfo.c", "silkjs-uv:src/unix/getnameinfo.c", "silkjs-uv:src/unix/loop-watcher.c",
    "silkjs-uv:src/unix/loop.c", "silkjs-uv:src/unix/pipe.c", "silkjs-uv:src/unix/poll.c", "silkjs-uv:src/unix/process.c",
    "silkjs-uv:src/unix/random-devurandom.c", "silkjs-uv:src/unix/signal.c", "silkjs-uv:src/unix/stream.c",
    "silkjs-uv:src/unix/tcp.c", "silkjs-uv:src/unix/thread.c", "silkjs-uv:src/unix/tty.c", "silkjs-uv:src/unix/udp.c",
    "silkjs-uv:src/unix/proctitle.c", "silkjs-uv:src/unix/linux.c", "silkjs-uv:src/unix/procfs-exepath.c",
    "silkjs-uv:src/unix/random-getrandom.c", "silkjs-uv:src/unix/random-sysctl-linux.c",
  ], include = ["silkjs-uv:include", "silkjs-uv:src"], flags = ["-std=gnu11", "-O2", "-w", "-DNDEBUG", "-D_FILE_OFFSET_BITS=64", "-D_LARGEFILE_SOURCE", "-D_GNU_SOURCE", "-D_POSIX_C_SOURCE=200112"], os = "linux" },
  { c = [
    "silkjs-uv:src/fs-poll.c", "silkjs-uv:src/idna.c", "silkjs-uv:src/inet.c", "silkjs-uv:src/random.c", "silkjs-uv:src/strscpy.c",
    "silkjs-uv:src/strtok.c", "silkjs-uv:src/thread-common.c", "silkjs-uv:src/threadpool.c", "silkjs-uv:src/timer.c",
    "silkjs-uv:src/uv-common.c", "silkjs-uv:src/uv-data-getter-setters.c", "silkjs-uv:src/version.c",
    "silkjs-uv:src/unix/async.c", "silkjs-uv:src/unix/core.c", "silkjs-uv:src/unix/dl.c", "silkjs-uv:src/unix/fs.c",
    "silkjs-uv:src/unix/getaddrinfo.c", "silkjs-uv:src/unix/getnameinfo.c", "silkjs-uv:src/unix/loop-watcher.c",
    "silkjs-uv:src/unix/loop.c", "silkjs-uv:src/unix/pipe.c", "silkjs-uv:src/unix/poll.c", "silkjs-uv:src/unix/process.c",
    "silkjs-uv:src/unix/random-devurandom.c", "silkjs-uv:src/unix/signal.c", "silkjs-uv:src/unix/stream.c",
    "silkjs-uv:src/unix/tcp.c", "silkjs-uv:src/unix/thread.c", "silkjs-uv:src/unix/tty.c", "silkjs-uv:src/unix/udp.c",
    "silkjs-uv:src/unix/proctitle.c", "silkjs-uv:src/unix/bsd-ifaddrs.c", "silkjs-uv:src/unix/kqueue.c",
    "silkjs-uv:src/unix/random-getentropy.c", "silkjs-uv:src/unix/darwin-proctitle.c", "silkjs-uv:src/unix/darwin.c",
    "silkjs-uv:src/unix/fsevents.c",
  ], include = ["silkjs-uv:include", "silkjs-uv:src"], flags = ["-std=gnu11", "-O2", "-w", "-DNDEBUG", "-D_FILE_OFFSET_BITS=64", "-D_LARGEFILE_SOURCE", "-D_DARWIN_UNLIMITED_SELECT=1", "-D_DARWIN_USE_64_BIT_INODE=1"], os = "macos" },
]
link = [
  { library = "pthread", mode = "dynamic", os = "linux" },
  { library = "dl", mode = "dynamic", os = "linux" },
  { library = "rt", mode = "dynamic", os = "linux" },
  { library = "m", mode = "dynamic", os = "linux" },
]

[native.archive.silkjs-uv]
url = "https://dist.libuv.org/dist/v1.51.0/libuv-v1.51.0.tar.gz"
sha256 = "5f0557b90b1106de71951a3c3931de5e0430d78da1d9a10287ebc7a3f78ef8eb"
strip = 1
