name: macOS cross-check
# Catches macOS-only build breaks from a Linux runner, without a macOS job: Silk codegen for
# aarch64-apple-darwin (foreign declaration clashes, Darwin-only code paths) and the vendored WAMR
# assembly for both Apple arms. Linking needs a macOS SDK, so a failure at the link stage is expected.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-cross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  darwin:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22
        run: |
          test -x /usr/bin/clang-22 || (sudo apt-get update && sudo apt-get install -y clang-22 lld-22)
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
      - name: Install the pinned Silk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export SILK_RELEASE="v$(sed -n 's/^silk-version = "\(.*\)"/\1/p' silk.toml)"
          curl --fail --location https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh --output "$RUNNER_TEMP/install-silk.sh"
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: WAMR native call entry assembles for macOS
        run: |
          for target in arm64-apple-macos13 x86_64-apple-macos13; do
            "$SILK_CLANG" --target=$target -c modules/runtime/vendor/wamr/invoke_native.c -o "$RUNNER_TEMP/invoke_native-$target.o"
          done
      - name: Runtime compiles for aarch64-apple-darwin
        working-directory: modules/runtime
        run: |
          set +e
          silk build --optimization=debug --target aarch64-apple-darwin --progress plain 2>&1 | tee "$RUNNER_TEMP/darwin.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0 && exit 0
          # Everything before linking must have passed; only the link stage may fail.
          if grep -Eq '^\s+codegen\s+[0-9,]+ functions' "$RUNNER_TEMP/darwin.log" && ! grep -Eq 'error\[SEM' "$RUNNER_TEMP/darwin.log"; then
            echo "Codegen passed; the link stage failed as expected without a macOS SDK."
          else
            echo "::error::The runtime does not compile for aarch64-apple-darwin (see the log above)."
            exit 1
          fi
