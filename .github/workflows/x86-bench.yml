# Throwaway measurement branch: never merge. Builds the refs in bench-x86/refs.txt
# and times fixed-work Octane Typescript against node --jitless on an x86 runner.
name: x86-bench
on:
  push:
    branches: [bench/x86-typescript]
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: host
        run: lscpu; free -g; nproc
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.2' }
      - uses: actions/cache@v4
        id: llvm
        with: { path: /opt/llvm22, key: llvm-22.1.8-x64 }
      - name: clang 22
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          curl -L --retry 5 -C - -o /tmp/llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
          sudo mkdir -p /opt/llvm22 && sudo chown $USER /opt/llvm22
          tar -xf /tmp/llvm.tar.xz -C /opt/llvm22 --strip-components=1 --wildcards '*/bin/clang*' '*/bin/lld*' '*/bin/ld.lld*' '*/bin/llvm-ar*' '*/bin/llvm-objdump*' '*/bin/llvm-symbolizer*' '*/lib/clang/*'
          rm /tmp/llvm.tar.xz; ls /opt/llvm22/bin
      - name: octane
        run: |
          git clone --depth 1 https://github.com/chromium/octane /tmp/octane
          cd /tmp/octane
          cat base.js typescript.js typescript-input.js typescript-compiler.js > /tmp/fx-typescript.js
          cat >> /tmp/fx-typescript.js <<'JS'
          var N=4;for (var s=0;s<BenchmarkSuite.suites.length;s++){var b=BenchmarkSuite.suites[s].benchmarks[0];
            BenchmarkSuite.ResetRNG(); if (b.Setup) b.Setup(); for (var k=0;k<N;k++) b.run(); }
          JS
          cat > /tmp/noderun.js <<'JS'
          globalThis.print = console.log.bind(console);
          require('vm').runInThisContext(require('fs').readFileSync(process.argv[2], 'utf8'), {filename: process.argv[2]});
          JS
          mkdir -p /tmp/bin
          printf '#!/bin/sh\nexec node --jitless /tmp/noderun.js "$@"\n' > /tmp/bin/v8-jitless
          printf '#!/bin/sh\nexec node --jitless --single-threaded /tmp/noderun.js "$@"\n' > /tmp/bin/v8-jitless-st
          chmod +x /tmp/bin/*
      - name: build refs
        run: |
          printf '#!/bin/sh\ncase " $* " in *" -c "*|*" -E "*|*" -S "*) exec /opt/llvm22/bin/clang "$@";; esac\nexec /opt/llvm22/bin/clang "$@" -Wl,--emit-relocs\n' > /tmp/clangw; chmod +x /tmp/clangw; cat /tmp/clangw
          export SILK_CLANG=/tmp/clangw
          while read name ref opt; do
            [ -z "$opt" ] && opt=--release
            [ -z "$name" ] && continue
            git worktree add -f /tmp/src-$name $ref
            ver=$(sed -n 's/^silk-version = "\(.*\)"/\1/p' /tmp/src-$name/silk.toml)
            if [ ! -d ~/.silk/toolchains/$ver ]; then
              mkdir -p ~/.silk/toolchains/$ver ~/.silk/bin
              gh release download "v$ver" -R silk-lang/silk -p "silk-$ver-x86_64-unknown-linux-gnu.tar.gz" -O /tmp/silk.tgz --clobber
              tar -xzf /tmp/silk.tgz -C ~/.silk/toolchains/$ver
              ls ~/.silk/toolchains/$ver
              d=~/.silk/toolchains/$ver; [ -x $d/bin/silk ] || d=$(dirname $(dirname $(find $d -name silk -path '*bin*' | head -1)))
              if [ "$d" != ~/.silk/toolchains/$ver ]; then mv $d/* ~/.silk/toolchains/$ver/; fi
              cp ~/.silk/toolchains/$ver/bin/silk ~/.silk/bin/silk
            fi
            printf 'default = "%s"\n' "$ver" > ~/.silk/settings.toml
            (cd /tmp/src-$name/modules/engine && mkdir -p build && time ~/.silk/bin/silk build $opt)
            find /tmp/src-$name/build -maxdepth 5 -name 'silkjs*' -newer bench-x86/refs.txt | head
            out=$(find /tmp/src-$name/build/llvm/x86_64-unknown-linux-gnu -maxdepth 2 -name silkjs -type f | head -1)
            cp $out /tmp/bin/silkjs-$name
            mkdir -p /tmp/art; cp $out /tmp/art/silkjs-$name; cp $(dirname $out)/*.symbols /tmp/art/silkjs-$name.symbols 2>/dev/null || true
          done < bench-x86/refs.txt
          ls -la /tmp/bin
      - name: fixed work
        run: cd /tmp && python3 $GITHUB_WORKSPACE/bench-x86/fx.py $(cat $GITHUB_WORKSPACE/bench-x86/rounds.txt) /tmp/bin/v8-jitless /tmp/bin/v8-jitless-st /tmp/bin/silkjs-*
      - name: extra
        run: if [ -f bench-x86/extra.sh ]; then bash bench-x86/extra.sh; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench, path: /tmp/art, retention-days: 3 }
