[package]
name = "silkjs"
version = "0.1.0"
silk-version = "0.1.0-dev.17+1120049495d3"
exports = [
  # Native engine ownership, runtime configuration, classes, and memory accounting.
  "js_engine", "js_engine_host", "js_engine_no_host",
  "runtime_memory", "native_stack", "js_heap", "js_value", "js_owned_value", "js_core_types",
  "js_runtime", "js_runtime_registry", "js_runtime_classes", "js_gc", "qjs_stats",
  "js_intrinsic_basic", "js_intrinsic_install", "js_intrinsic_install_families",
  "js_intl", "js_temporal",

  # Values, atoms, conversion, exceptions, and object/property operations.
  "js_atoms", "js_atom_data", "js_class_data", "js_strings", "js_string_types",
  "js_bigint", "js_bigint_coercions", "js_primitives", "js_primitive_coercions",
  "js_coercions", "js_integer_coercions", "js_boxing", "js_exceptions", "js_errors",
  "js_object_allocate", "js_constructor_ops", "js_membership",
  "js_property_get", "js_property_queries", "js_property_names",
  "js_property_descriptors", "js_property_mutations", "js_property_delete",
  "js_property_ownership", "js_prototypes", "js_array_intrinsics_support",
  "js_date_intrinsics", "js_iterators",

  # Execution, host functions, modules, promises, jobs, and serialization.
  "js_vm", "js_eval", "js_eval_compile", "js_lexer",
  "js_native_functions", "js_intrinsic_properties", "js_auto_init",
  "js_module_native", "js_module_metadata", "js_module_loader", "js_module_namespace",
  "js_module_dynamic_import", "js_promise", "js_runtime_jobs",
  "js_binary_object_reader", "js_binary_object_writer",
  "js_json_parse", "js_json_intrinsics_stringify", "js_value_print",
  "js_buffer_storage", "js_shared_memory", "js_typed_array_buffer", "js_atomics_native",

  # Public generic bounds, callback results, and typed JSON parse failures.
  "js_coercion_host", "js_call_host", "js_property_host", "js_property_write_host",
  "js_prototype_host", "js_error_host", "js_native_function_host",
  "js_interrupt_host", "js_eval_host", "js_module_host", "js_parser_host",
  "js_date_host", "js_date",
  "js_parser_diagnostics", "js_parser_core", "js_debug_positions",

  # Optional libc sessions and the existing generated-code/plugin contracts.
  "js_libc", "js_libc_services", "js_libc_process", "js_os_workers", "js_os_workers_transport",
  "js_os_workers_resources", "js_os_platform_terminal",
  "qjsc_runtime", "js_libc_modules",
  "js_libc_plugins", "js_libc_plugins_fixture", "js_libc_plugins_abi",
  "js_libc_bjson_plugin",
]
